<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linx AI</title>
<style>
:root{
  --bg:#0b0d12;--panel:#11141b;--panel2:#181c25;--text:#f4f6fb;
  --muted:#9299a8;--accent:#7c5cff;--border:rgba(255,255,255,.09);
  --user:#242938;--danger:#ff5c67;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
#background{position:fixed;inset:0;background:var(--bg) center/cover no-repeat;z-index:-5;transition:background .25s}
#particles{position:fixed;inset:0;z-index:-4;pointer-events:none}
#rain{position:fixed;inset:0;z-index:-3;pointer-events:none;display:none;overflow:hidden}
.raindrop{position:absolute;top:-60px;width:1px;height:45px;background:linear-gradient(transparent,rgba(190,220,255,.75));transform:rotate(14deg);animation:rain linear infinite}
@keyframes rain{to{transform:translate(180px,110vh) rotate(14deg)}}
#lightning{position:fixed;inset:0;background:rgba(220,235,255,.85);opacity:0;z-index:-2;pointer-events:none}
.lightning{animation:flash .7s ease-out}
@keyframes flash{0%,100%{opacity:0}8%{opacity:.75}13%{opacity:0}21%{opacity:.45}27%{opacity:0}}
.app{height:100%;display:flex}
.sidebar{width:285px;background:rgba(12,14,20,.93);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:.25s;z-index:5}
.sidebar.closed{width:0;overflow:hidden;border:0}
.brand{height:70px;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:21px;font-weight:750}
.logo{width:35px;height:35px;border-radius:11px;background:var(--accent);display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 8px 30px color-mix(in srgb,var(--accent),transparent 55%)}
.newchat{margin:8px 14px 16px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px;text-align:left}
.newchat:hover{background:#202532}
.section-title{font-size:11px;color:var(--muted);padding:0 17px 8px;text-transform:uppercase;letter-spacing:.08em}
.chats{overflow:auto;flex:1;padding:0 8px}
.chat-item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;margin-bottom:3px;color:#dfe3eb}
.chat-item:hover,.chat-item.active{background:#1b1f29}
.chat-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:14px}
.chat-delete{border:0;background:none;color:#747b89;opacity:0;padding:3px}
.chat-item:hover .chat-delete{opacity:1}
.bottom{padding:10px;border-top:1px solid var(--border)}
.settings-btn{width:100%;padding:11px;border:0;background:transparent;color:#dfe3eb;text-align:left;border-radius:10px}
.settings-btn:hover{background:#1b1f29}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px;background:rgba(11,13,18,.68);backdrop-filter:blur(15px)}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.04);color:var(--text);font-size:18px}
.title{font-weight:700;flex:1}
.model{font-size:12px;color:var(--muted);padding-right:8px}
.messages{flex:1;overflow:auto;padding:30px max(18px,calc((100% - 900px)/2));scroll-behavior:smooth}
.welcome{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
.welcome-inner{max-width:650px}
.welcome-logo{width:68px;height:68px;border-radius:20px;background:var(--accent);display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 20px;box-shadow:0 20px 60px color-mix(in srgb,var(--accent),transparent 55%)}
.welcome h1{font-size:38px;margin:0 0 10px}
.welcome p{color:var(--muted);margin:0}
.message{display:flex;gap:13px;margin:0 auto 25px;max-width:900px;line-height:1.65}
.avatar{width:34px;height:34px;border-radius:10px;flex:0 0 34px;display:grid;place-items:center;font-size:12px;font-weight:800}
.user .avatar{background:#343a4a}.assistant .avatar{background:var(--accent)}
.content{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.content code{background:#080a0e;padding:2px 5px;border-radius:5px}
.composer-wrap{padding:12px max(18px,calc((100% - 900px)/2)) 20px;background:linear-gradient(transparent,rgba(11,13,18,.92) 25%)}
.composer{display:flex;gap:8px;border:1px solid var(--border);background:rgba(20,23,31,.93);border-radius:16px;padding:10px;box-shadow:0 15px 50px rgba(0,0,0,.25)}
#input{resize:none;flex:1;max-height:180px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);padding:10px}
.send{width:44px;height:44px;border:0;border-radius:11px;background:var(--accent);color:white;font-size:18px}
.send:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;color:#666e7d;font-size:11px;margin-top:7px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.overlay.show{display:block}
.settings{position:fixed;right:18px;top:78px;width:min(390px,calc(100% - 36px));max-height:calc(100% - 96px);overflow:auto;background:#11141b;border:1px solid var(--border);border-radius:16px;padding:18px;z-index:11;box-shadow:0 25px 80px rgba(0,0,0,.5);display:none}
.settings.show{display:block}
.settings h2{margin:0 0 16px}
.setting{padding:13px 0;border-top:1px solid var(--border)}
.setting:first-of-type{border-top:0}
.setting label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}
.setting small{color:var(--muted);display:block;margin-top:6px;line-height:1.4}
input[type=color]{width:100%;height:38px;border:0;background:transparent}
input[type=file]{width:100%;color:var(--muted)}
.range{width:100%}
.switch{display:flex;align-items:center;justify-content:space-between}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
select,.text-input{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:#191d26;color:var(--text);outline:0}
.clear{width:100%;padding:10px;border:1px solid rgba(255,92,103,.3);background:transparent;color:var(--danger);border-radius:9px}
.typing{color:var(--muted)}
@media(max-width:700px){
 .sidebar{position:absolute;left:0;top:0;bottom:0;box-shadow:15px 0 50px rgba(0,0,0,.4)}
 .sidebar.closed{width:0}
 .welcome h1{font-size:30px}
 .model{display:none}
}
</style>
</head>
<body>
<div id="background"></div><canvas id="particles"></canvas><div id="rain"></div><div id="lightning"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">L</div> Linx AI</div>
    <button class="newchat" id="newChat">＋ New chat</button>
    <div class="section-title">Your chats</div>
    <div class="chats" id="chatList"></div>
    <div class="bottom"><button class="settings-btn" id="settingsBtn">⚙ Settings</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div class="title" id="chatTitle">New chat</div>
      <div class="model" id="modelLabel"></div>
      <button class="icon-btn" id="renameBtn" title="Rename chat">✎</button>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="Message Linx AI..." rows="1"></textarea>
        <button class="send" id="send">➤</button>
      </div>
      <div class="hint">Enter to send · Shift + Enter for a new line</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<section class="settings" id="settings">
  <h2>⚙ Linx AI Settings</h2>

  <div class="setting">
    <label>Background color</label>
    <input type="color" id="bgColor" value="#0b0d12">
  </div>

  <div class="setting">
    <label>Accent color</label>
    <input type="color" id="accentColor" value="#7c5cff">
  </div>

  <div class="setting">
    <label>Custom background image</label>
    <input type="file" id="bgImage" accept="image/*">
    <small>The image is stored in your browser for this device.</small>
  </div>

  <div class="setting">
    <div class="switch"><label>Particles</label><input type="checkbox" id="particlesToggle"></div>
    <small>Animated floating particles.</small>
  </div>

  <div class="setting">
    <div class="switch"><label>Realistic rain</label><input type="checkbox" id="rainToggle"></div>
    <small>Animated rain over the entire app.</small>
  </div>

  <div class="setting">
    <div class="switch"><label>Lightning</label><input type="checkbox" id="lightningToggle"></div>
    <small>Occasional flashes when enabled.</small>
  </div>

  <div class="setting">
    <label>AI model</label>
    <select id="modelSelect"></select>
  </div>

  <div class="setting">
    <button class="clear" id="clearChats">Delete all saved chats</button>
  </div>
</section>

<script>
/* ============================================================
   LINX AI CONFIGURATION
   ============================================================ */

const API_KEY = "${{ secrets.API_KEY }}";

/* Put your preferred Groq model here. */
const DEFAULT_MODEL = "openai/gpt-oss-120b";

/* Other models you can try if your Groq account supports them. */
const MODELS = [
  "openai/gpt-oss-120b",
  "openai/gpt-oss-20b",
  "qwen/qwen3.8-27b"
];

/* This tells the AI how Linx AI should behave. */
const SYSTEM_PROMPT =
  "You are Linx AI, a helpful, friendly and intelligent AI assistant. " +
  "Give clear answers and follow the user's instructions. " +
  "Use markdown-style formatting when useful. " +
  "If the user asks who made, created, built, or developed Linx AI, answer: Mason Graves.";

/* ============================================================ */

const $ = id => document.getElementById(id);
const STORAGE = "linx_ai_data_v1";
const SETTINGS_STORAGE = "linx_ai_settings_v1";

let data = JSON.parse(localStorage.getItem(STORAGE) || "null") || {
  chats: [],
  current: null
};

let prefs = JSON.parse(localStorage.getItem(SETTINGS_STORAGE) || "null") || {
  bg:"#0b0d12", accent:"#7c5cff", particles:false, rain:false, lightning:false, image:""
};

function save(){localStorage.setItem(STORAGE,JSON.stringify(data))}
function savePrefs(){localStorage.setItem(SETTINGS_STORAGE,JSON.stringify(prefs))}

function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function newChat(){
  const chat={id:makeId(),title:"New chat",messages:[],created:Date.now()};
  data.chats.unshift(chat);
  data.current=chat.id;
  save(); render();
  $("input").focus();
}

function currentChat(){
  return data.chats.find(c=>c.id===data.current);
}

function render(){
  renderChatList();
  renderMessages();
  const chat=currentChat();
  $("chatTitle").textContent=chat?.title || "New chat";
}

function renderChatList(){
  $("chatList").innerHTML="";
  data.chats.forEach(chat=>{
    const item=document.createElement("div");
    item.className="chat-item"+(chat.id===data.current?" active":"");
    const name=document.createElement("div");
    name.className="chat-name";
    name.textContent=chat.title;
    const del=document.createElement("button");
    del.className="chat-delete";
    del.textContent="×";
    del.title="Delete chat";
    del.onclick=e=>{
      e.stopPropagation();
      data.chats=data.chats.filter(c=>c.id!==chat.id);
      if(data.current===chat.id) data.current=data.chats[0]?.id||null;
      save();render();
    };
    item.onclick=()=>{data.current=chat.id;save();render()};
    item.append(name,del);
    $("chatList").appendChild(item);
  });
}

function renderMessages(){
  const box=$("messages");
  box.innerHTML="";
  const chat=currentChat();
  if(!chat || chat.messages.length===0){
    box.innerHTML=`<div class="welcome"><div class="welcome-inner">
      <div class="welcome-logo">L</div>
      <h1>How can I help?</h1>
      <p>Welcome to Linx AI. Start a conversation below.</p>
    </div></div>`;
    return;
  }
  chat.messages.forEach(m=>addMessageElement(m.role,m.content,false));
  box.scrollTop=box.scrollHeight;
}

function addMessageElement(role,content,scroll=true){
  const box=$("messages");
  const row=document.createElement("div");
  row.className="message "+role;
  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=role==="user"?"YOU":"L";
  const body=document.createElement("div");
  body.className="content";
  body.textContent=content;
  row.append(avatar,body);
  box.appendChild(row);
  if(scroll) box.scrollTop=box.scrollHeight;
  return row;
}

function addTyping(){
  const box=$("messages");
  const row=document.createElement("div");
  row.className="message assistant";
  row.id="typing";
  row.innerHTML='<div class="avatar">L</div><div class="content typing">Linx AI is thinking…</div>';
  box.appendChild(row);
  box.scrollTop=box.scrollHeight;
}

async function sendMessage(){
  const input=$("input");
  const text=input.value.trim();
  if(!text) return;

  if(!GROQ_API_KEY || GROQ_API_KEY.includes("PASTE_YOUR")){
    alert("Paste your Groq API key into GROQ_API_KEY near the top of this file first.");
    return;
  }

  if(!currentChat()) newChat();
  const chat=currentChat();

  if(chat.messages.length===0){
    chat.title=text.length>34?text.slice(0,34)+"…":text;
  }

  chat.messages.push({role:"user",content:text});
  input.value="";
  resizeInput();
  save();render();
  addTyping();
  $("send").disabled=true;

  try{
    const response=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+GROQ_API_KEY
      },
      body:JSON.stringify({
        model:$("modelSelect").value||DEFAULT_MODEL,
        messages:[
          {role:"system",content:SYSTEM_PROMPT},
          ...chat.messages
        ],
        temperature:.7
      })
    });

    const result=await response.json();
    if(!response.ok) throw new Error(result.error?.message||"Groq API request failed.");

    const answer=result.choices?.[0]?.message?.content||"I didn't receive a response.";
    chat.messages.push({role:"assistant",content:answer});
    save();
    $("typing")?.remove();
    render();
  }catch(err){
    $("typing")?.remove();
    const errorText="Sorry, I couldn't reach Groq.\n\n"+err.message;
    chat.messages.push({role:"assistant",content:errorText});
    save();render();
  }finally{
    $("send").disabled=false;
    input.focus();
  }
}

function resizeInput(){
  const el=$("input");
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,180)+"px";
}

function applyPrefs(){
  document.documentElement.style.setProperty("--bg",prefs.bg);
  document.documentElement.style.setProperty("--accent",prefs.accent);
  $("bgColor").value=prefs.bg;
  $("accentColor").value=prefs.accent;
  $("particlesToggle").checked=prefs.particles;
  $("rainToggle").checked=prefs.rain;
  $("lightningToggle").checked=prefs.lightning;
  $("background").style.backgroundImage=prefs.image?`url("${prefs.image}")`:"none";
  $("background").style.backgroundColor=prefs.bg;
  $("rain").style.display=prefs.rain?"block":"none";
  setupParticles();
}

function setupParticles(){
  const canvas=$("particles"),ctx=canvas.getContext("2d");
  canvas.width=innerWidth;canvas.height=innerHeight;
  if(!prefs.particles){ctx.clearRect(0,0,canvas.width,canvas.height);return}
  const count=Math.min(110,Math.floor(innerWidth/12));
  const dots=Array.from({length:count},()=>({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height,
    r:Math.random()*1.8+.4,v:Math.random()*.45+.08
  }));
  function animate(){
    if(!prefs.particles){ctx.clearRect(0,0,canvas.width,canvas.height);return}
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="rgba(255,255,255,.5)";
    dots.forEach(p=>{
      p.y-=p.v;if(p.y<0)p.y=canvas.height;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

function setupRain(){
  const rain=$("rain");
  rain.innerHTML="";
  for(let i=0;i<120;i++){
    const d=document.createElement("div");
    d.className="raindrop";
    d.style.left=Math.random()*110+"%";
    d.style.animationDuration=(.45+Math.random()*.6)+"s";
    d.style.animationDelay=(-Math.random()*2)+"s";
    d.style.opacity=.2+Math.random()*.7;
    rain.appendChild(d);
  }
}

let lightningTimer;
function setupLightning(){
  clearTimeout(lightningTimer);
  if(!prefs.lightning)return;
  function flash(){
    if(!prefs.lightning)return;
    $("lightning").classList.remove("lightning");
    void $("lightning").offsetWidth;
    $("lightning").classList.add("lightning");
    lightningTimer=setTimeout(flash,3500+Math.random()*8000);
  }
  lightningTimer=setTimeout(flash,2500+Math.random()*5000);
}

function openSettings(){
  $("settings").classList.add("show");
  $("overlay").classList.add("show");
}
function closeSettings(){
  $("settings").classList.remove("show");
  $("overlay").classList.remove("show");
}

$("newChat").onclick=newChat;
$("send").onclick=sendMessage;
$("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});
$("input").addEventListener("input",resizeInput);
$("menuBtn").onclick=()=> $("sidebar").classList.toggle("closed");
$("settingsBtn").onclick=openSettings;
$("overlay").onclick=closeSettings;

$("renameBtn").onclick=()=>{
  const chat=currentChat();
  if(!chat)return;
  const name=prompt("Chat name:",chat.title);
  if(name?.trim()){chat.title=name.trim();save();render()}
};

$("bgColor").oninput=e=>{prefs.bg=e.target.value;savePrefs();applyPrefs()};
$("accentColor").oninput=e=>{prefs.accent=e.target.value;savePrefs();applyPrefs()};
$("particlesToggle").onchange=e=>{prefs.particles=e.target.checked;savePrefs();applyPrefs()};
$("rainToggle").onchange=e=>{prefs.rain=e.target.checked;savePrefs();applyPrefs()};
$("lightningToggle").onchange=e=>{prefs.lightning=e.target.checked;savePrefs();applyPrefs()};

$("bgImage").onchange=e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    prefs.image=reader.result;
    savePrefs();applyPrefs();
  };
  reader.readAsDataURL(file);
};

$("clearChats").onclick=()=>{
  if(confirm("Delete every saved Linx AI chat?")){
    data={chats:[],current:null};save();render();
  }
};

MODELS.forEach(m=>{
  const o=document.createElement("option");
  o.value=m;o.textContent=m;
  $("modelSelect").appendChild(o);
});
$("modelSelect").value=DEFAULT_MODEL;
$("modelLabel").textContent=DEFAULT_MODEL;
$("modelSelect").onchange=()=>{
  $("modelLabel").textContent=$("modelSelect").value;
};

setupRain();
applyPrefs();
render();
</script>
</body>
</html>
